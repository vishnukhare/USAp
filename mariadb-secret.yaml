apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secret
type: Opaque
data:
  # The values must be Base64 encoded strings
  # Use: echo -n 'user' | base64
  MYSQL_USER: dXNlcg==     # Replace with your actual Base64 value for 'user'
  MYSQL_PASSWORD: cGFzc3dvcmQ= # Replace with your actual Base64 value for 'password'
  MYSQL_DATABASE: ZWRvYw==   # Replace with your actual Base64 value for 'edoc'
  # The root password is only needed for the database deployment itself
  MYSQL_ROOT_PASSWORD: <BASE64_ROOT_PASSWORD>