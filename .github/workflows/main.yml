# .github/workflows/main.yml
name: CI/CD Pipeline to Docker Registry

on:
  push:
    # Change the branch to match your main branch name
    branches: [ "phase-0" ] 

jobs:
  build_and_push_image:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 1. CRITICAL: LOG IN using GitHub Secrets
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 2. CRITICAL: BUILD AND PUSH
    - name: Build and push PHP image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true # This makes the image available to Kubernetes
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/php-appointment-system:latest
          ${{ secrets.DOCKER_USERNAME }}/php-appointment-system:${{ github.sha }}
