name: K8s CI/CD Pipeline

on:
  push:
    branches:
      - phase-0
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # 1. CI JOB: Builds the Docker image and pushes to Docker Hub
  # ----------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/usap-web
          tags: |
            type=sha,prefix=
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ----------------------------------------------------
  # 2. CD JOB: Deploys to Local K8s Cluster (Docker Desktop)
  # ----------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: self-hosted # Targets your local CYCLOPE runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Deploy Application to Kubernetes
        env:
          # Define the image name outside of the YAML files
          WEB_IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/usap-web:latest
        run: |
          # 1. Substitute the image name in the web-app.yaml before applying
          # The sed command replaces the placeholder with the real image name.
          sed -i 's|DOCKER_IMAGE_PLACEHOLDER|${{ env.WEB_IMAGE_NAME }}|g' web-app.yaml

          echo "Applying Secrets and Deployments..."
          kubectl apply -f mariadb-secret.yaml
          kubectl apply -f mariadb-db.yaml

          echo "Applying Web Application Deployment..."
          kubectl apply -f web-app.yaml

          # Force a rolling restart to pick up the new changes
          kubectl rollout restart deployment/usap-web-deployment

          # Verify deployment status (waits for Pods to be ready)
          kubectl rollout status deployment/usap-web-deployment --timeout=5m
          kubectl rollout status deployment/mariadb-deployment --timeout=5m