name: K8s CI/CD Pipeline

on:
  push:
    branches:
      - phase-0
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # 1. CI JOB: Builds the Docker image and pushes to Docker Hub
  # ----------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/usap-web
          tags: |
            type=sha,prefix=
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          # Use the newly built image tag
          image-ref: ${{ secrets.DOCKER_USERNAME }}/usap-web:latest
          format: 'table'
          exit-code: '0' # Don't fail the pipeline yet, just report
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
      # --- END: TRIVY SCAN ADDITION ---

  # ----------------------------------------------------
  # 2. CD JOB: Deploys to Local K8s Cluster (Docker Desktop)
  # ----------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: self-hosted # Targets your local CYCLOPE runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Deploy Application to Kubernetes
        env:
          WEB_IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/usap-web:latest
        run: |
          # Navigate to the project directory (ensure runner starts in the correct directory)
          cd C:\xampp\htdocs\univarasl-apointment-system 
          
          echo "Forcing cleanup of all prior resources..."
          # Delete all existing resources to prevent Persistent Volume lock issues
          # Note: '|| true' or try/catch is used to prevent failure if resources don't exist yet.
          kubectl delete deployment usap-web-deployment --ignore-not-found=true
          kubectl delete deployment mariadb-deployment --ignore-not-found=true
          kubectl delete service usap-web-service --ignore-not-found=true
          kubectl delete service mariadb-service --ignore-not-found=true
          kubectl delete secret mariadb-secret --ignore-not-found=true
          kubectl delete pvc mariadb-pvc --ignore-not-found=true
          
          # CRITICAL CLEANUP: Force delete any terminating/stuck pods (using try/catch for PowerShell)
          try {
              kubectl delete pods -l app=usap-web --force --grace-period=0
              kubectl delete pods -l app=mariadb --force --grace-period=0
          }
          catch {
              Write-Host "Cleanup of old pods failed, proceeding anyway."
          }
          
          Start-Sleep -Seconds 5 # Wait for volume detach
          
          # 1. Substitute the image name in the web-app.yaml before applying
          $content = Get-Content web-app.yaml
          $content -replace "DOCKER_IMAGE_PLACEHOLDER", "${{ env.WEB_IMAGE_NAME }}" | Set-Content web-app.yaml

          echo "Applying Secrets and Deployments..."
          kubectl apply -f mariadb-secret.yaml
          kubectl apply -f mariadb-db.yaml

          echo "Applying Web Application Deployment..."
          # Apply the web app deployment
          kubectl apply -f web-app.yaml

          # Verify deployment status (waits for Pods to be ready)
          echo "Waiting for Web App deployment to rollout..."
          kubectl rollout status deployment/usap-web-deployment --timeout=5m
          kubectl rollout status deployment/mariadb-deployment --timeout=5m

  # ----------------------------------------------------
  # 3. MONITORING JOB: Deploy Prometheus and Grafana (using Helm)
  # ----------------------------------------------------
  monitor:
    needs: deploy # Runs only after the application deployment succeeds
    runs-on: self-hosted # Targets your local CYCLOPE runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Prometheus and Grafana
        run: |
          echo "Setting up Helm repositories..."
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

          # Install the prometheus-stack which includes Prometheus and Grafana
          echo "Deploying kube-prometheus-stack..."
          # FIX: Replaced '\' with PowerShell backtick '`' for line continuation
          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack `
            --namespace monitoring --create-namespace `
            --set prometheus.service.type=NodePort `
            --set grafana.service.type=NodePort
          
          echo "Monitoring stack deployed! Run 'kubectl get svc -n monitoring' to find ports."