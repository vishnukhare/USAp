# jenkins-rbac.yaml

# 1. Define a Role: Grants permission to read secrets in the 'default' namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-secrets-reader
  namespace: default
rules:
- apiGroups: [""] # "" means core API group (Secrets are in the core API group)
  resources: ["secrets"]
  verbs: ["get", "list", "watch"] # Allow reading/watching of secrets

---

# 2. Define a RoleBinding: Binds the Role to the Jenkins Service Account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-secrets-reader-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: default # Binds to the 'default' service account
  namespace: default
roleRef:
  kind: Role
  name: jenkins-secrets-reader # References the Role defined above
  apiGroup: rbac.authorization.k8s.io
  