# jenkins-deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins-master
  template:
    metadata:
      labels:
        app: jenkins-master
    spec:
      serviceAccountName: default # Ensure the default SA (which you gave RBAC permissions) is used
      containers:
      - name: jenkins
        # Use an image that has the Docker CLI installed (CRITICAL FIX)
        # You may need to replace this with your custom image if you built one.
        image: jenkinsci/blueocean:latest 
        ports:
        - containerPort: 30000 # Jenkins Web UI
        - containerPort: 50000 # Jenkins Agent Connection
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
        volumeMounts:
        # 1. CRITICAL DOCKER FIX: Mount the host's Docker socket
        - name: docker-socket
          mountPath: /var/run/docker.sock 
        - name: jenkins-data
          mountPath: /var/jenkins_home
      
      # Define the Volumes needed for the Pod
      volumes:
      # 1. CRITICAL DOCKER FIX: Define the hostPath volume for the socket
      - name: docker-socket
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      # 2. Persistent Volume for Jenkins data (optional, but recommended)
      - name: jenkins-data
        emptyDir: {} # Use a Persistent Volume Claim (PVC) here in a non-local setup