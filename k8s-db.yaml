# k8s-db.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi # Requests 5GB of storage

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb-deployment
  labels: { app: mariadb }
spec:
  selector: { matchLabels: { app: mariadb } }
  template:
    metadata: { labels: { app: mariadb } }
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.5
        ports: [{ containerPort: 3306 }]
        # Inject MySQL environment variables from the Secret
        env:
        # CRITICAL FIX: The MariaDB image expects this name for initialization
        - name: MARIADB_ROOT_PASSWORD 
          valueFrom: 
            secretKeyRef:
              name: usap-db-creds # Your Secret name
              key: DB_PASSWORD     # Key in your Secret holding the root password
        
        # Inject other variables (optional, as the web app uses the regular user)
        # However, keeping them ensures the regular user is created during initialization
        - name: MARIADB_DATABASE
          valueFrom: { secretKeyRef: { name: usap-db-creds, key: DB_NAME } }
        - name: MARIADB_USER
          valueFrom: { secretKeyRef: { name: usap-db-creds, key: DB_USER } }
        - name: MARIADB_PASSWORD
          valueFrom: { secretKeyRef: { name: usap-db-creds, key: DB_PASSWORD } }
          
        volumeMounts:
        - name: mariadb-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: mariadb-storage
        persistentVolumeClaim: { claimName: mariadb-pvc }

---
apiVersion: v1
kind: Service
metadata:
  name: db # Critical: This is the hostname used by your PHP app (DB_HOST: db)
spec:
  selector: { app: mariadb }
  ports: [{ protocol: TCP, port: 3306, targetPort: 3306 }]
  clusterIP: None # Headless service for simple database discovery