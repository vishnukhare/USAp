# k8s-prometheus.yaml

# 1. Configuration: Tells Prometheus which metrics targets to scrape
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels: { app: prometheus }
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      # Scrape the Kubernetes internal metrics (built-in service)
      - job_name: 'kubernetes-cadvisor'
        scheme: https
        kubernetes_sd_configs:
        - role: node
        tls_config:
          insecure_skip_verify: true
        relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
        - target_label: __address__
          replacement: kubernetes.default.svc:443
        - source_labels: [__meta_kubernetes_node_name]
          regex: (.+)
          target_label: __metrics_path__
          replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
      
      # Scrape your PHP application metrics (assuming /metrics endpoint)
      - job_name: 'php-web-app'
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          action: keep
          regex: php-web # Matches the label on your php-web-deployment pods
        - source_labels: [__meta_kubernetes_pod_container_port_name]
          action: keep
          regex: http # Assuming your web app exposes metrics on a port named 'http' or similar

---

# 2. Deployment: Runs the Prometheus Server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-deployment
  labels: { app: prometheus }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.53.0 # Use a stable Prometheus version
        args:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--storage.tsdb.path=/prometheus"
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: prometheus-config-volume
          mountPath: /etc/prometheus
        - name: prometheus-storage
          mountPath: /prometheus
      volumes:
      - name: prometheus-config-volume
        configMap:
          name: prometheus-config # References the ConfigMap defined above
      - name: prometheus-storage
        emptyDir: {} # Using emptyDir for simple local storage

---

# 3. Service: Exposes Prometheus internally for Grafana
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service # CRITICAL: This name is the hostname Grafana will use
  labels: { app: prometheus }
spec:
  selector: { app: prometheus }
  ports:
  - protocol: TCP
    port: 9090
    targetPort: 9090